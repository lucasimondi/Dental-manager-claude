<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient entry responsive QA</title></head><body style="margin:8px;background:#dfe8f2;font-family:system-ui"><nav id="sizes"><button>375</button><button>768</button><button>1024</button><button>1440</button></nav><p><button id="v2">Scheda V2</button><button id="multi">Più piani</button><button id="keyboard">Simula tastiera</button><button id="seed">Piano esistente</button><button id="fail">Errore salvataggio</button></p><iframe title="Poliedra test" src="patient-entry.html?keyboard=test" style="width:375px;height:740px;border:1px solid #ccc"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('#sizes button').forEach(b=>b.onclick=()=>frame.style.width=b.textContent+'px');document.querySelector('#v2').onclick=()=>frame.src='patient-entry.html?v2=1&keyboard=test';document.querySelector('#multi').onclick=()=>frame.src='patient-entry.html?plans=2&keyboard=test';let keyboardOpen=false;document.querySelector('#keyboard').onclick=()=>{keyboardOpen=!keyboardOpen;frame.contentWindow.postMessage({type:'test-keyboard',open:keyboardOpen},location.origin);};document.querySelector('#seed').onclick=()=>frame.src='patient-entry.html?plans=1&seed=1&discount=20&keyboard=test';document.querySelector('#fail').onclick=()=>frame.contentWindow.__failSave=true;</script></body></html>
