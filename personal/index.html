<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Personal"/>
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<link rel="manifest" href="/personal.webmanifest"/>
<link rel="icon" href="/poliedron-v2-192.png" sizes="192x192"/>
<link rel="apple-touch-icon" href="/poliedron-v2-180.png"/>
<title>Poliedron Personal</title>
<script>
  // Sul dominio proprio l'app vive su /personal/: manifest con start_url e scope di quell'indirizzo.
  if (location.hostname === 'personal.poliedrasoft.it') document.addEventListener('DOMContentLoaded', function () {
    var l = document.querySelector('link[rel="manifest"]'); if (l) l.href = '/personal-dominio.webmanifest';
  });
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="./src/main.jsx"></script>
</body>
</html>
