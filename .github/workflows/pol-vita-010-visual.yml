name: Agenda mobile visual regression
on:
  pull_request:
    branches: [master]
    paths:
      - 'shared/agenda/**'
      - 'src/components/Agenda.jsx'
      - 'src/App.jsx'
      - 'src/components/PatientAgenda*.jsx'
      - 'src/components/PatientWorkspace*.jsx'
      - 'src/components/SchedaPaz.jsx'
      - 'src/components/Pazienti.jsx'
      - 'src/components/PianoDrillDown.jsx'
      - 'src/components/AppointmentWorkspace*'
      - 'src/components/EmbeddedForm.jsx'
      - 'src/components/IncassoModal.jsx'
      - 'src/components/DocMedico.jsx'
      - 'src/components/Piani.jsx'
      - 'src/lib/appointmentQuickHub.js'
      - 'src/lib/patientAgendaBooking.js'
      - 'src/components/PremiumVisualSystem.css'
      - 'src/components/ui/Ic.jsx'
      - 'personal/src/**'
      - 'tests/visual/**'
      - 'package*.json'
      - '.github/workflows/pol-vita-010-visual.yml'
permissions:
  contents: read
jobs:
  iphone-agenda:
    runs-on: ubuntu-latest
    # 25: two bounded install attempts (5 min each) plus the tests (~6 min) fit with margin.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The single `playwright install --with-deps` step sometimes hung until the job timed out (runs cancelled on
      # 11 and 18 Nov 2026 before any test). Browsers are cached by Playwright version; system packages and
      # browsers are installed in separate steps, each bounded to 5 minutes with one automatic retry.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      - name: Install browser system dependencies
        run: |
          for i in 1 2; do timeout 300 npx playwright install-deps chromium webkit && exit 0; echo "install-deps attempt $i failed or timed out"; sleep 10; done; exit 1
      - name: Install browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2; do timeout 300 npx playwright install chromium webkit && exit 0; echo "install attempt $i failed or timed out"; sleep 10; done; exit 1
      - run: node tests/visual/appointment-workspace.mjs
      - run: node tests/visual/agenda-actions.mjs
      - run: node tests/visual/patient-agenda.mjs
      - run: npm run test:agenda:visual
        env:
          AGENDA_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - run: npm run test:agenda:reliability
      - run: node tests/visual/agenda.sharing.mjs
      - run: node tests/visual/agenda.ricerca.mjs
      - run: node tests/visual/agenda.motion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agenda-iphone-comparisons
          path: |
            tests/visual/results/
            tests/visual/results-reliability/
            tests/visual/results-sharing/
            tests/visual/results-ricerca/
            tests/visual/results-motion/
            tests/visual/results-patient-agenda/
            tests/visual/results-agenda-actions/
            tests/visual/results-appointment-workspace/
