name: Agenda mobile visual regression
on:
  pull_request:
    branches: [master]
    paths:
      - 'shared/agenda/**'
      - 'src/components/Agenda.jsx'
      - 'src/App.jsx'
      - 'src/components/PatientAgenda*.jsx'
      - 'src/components/PatientWorkspace*.jsx'
      - 'src/components/SchedaPaz.jsx'
      - 'src/components/Pazienti.jsx'
      - 'src/components/PianoDrillDown.jsx'
      - 'src/components/AppointmentWorkspace*'
      - 'src/components/EmbeddedForm.jsx'
      - 'src/components/IncassoModal.jsx'
      - 'src/components/DocMedico.jsx'
      - 'src/components/Piani.jsx'
      - 'src/lib/appointmentQuickHub.js'
      - 'src/lib/patientAgendaBooking.js'
      - 'src/components/PremiumVisualSystem.css'
      - 'src/components/ui/Ic.jsx'
      - 'personal/src/**'
      - 'tests/visual/**'
      - 'package*.json'
      - '.github/workflows/pol-vita-010-visual.yml'
permissions:
  contents: read
jobs:
  iphone-agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/visual/appointment-workspace.mjs
      - run: node tests/visual/agenda-actions.mjs
      - run: node tests/visual/patient-agenda.mjs
      - run: npm run test:agenda:visual
        env:
          AGENDA_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - run: npm run test:agenda:reliability
      - run: node tests/visual/agenda.sharing.mjs
      - run: node tests/visual/agenda.motion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agenda-iphone-comparisons
          path: |
            tests/visual/results/
            tests/visual/results-reliability/
            tests/visual/results-sharing/
            tests/visual/results-motion/
            tests/visual/results-patient-agenda/
            tests/visual/results-agenda-actions/
            tests/visual/results-appointment-workspace/
