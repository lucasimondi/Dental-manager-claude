name: Agenda mobile visual regression
on:
  pull_request:
    branches: [master]
    paths:
      - 'shared/agenda/**'
      - 'src/components/Agenda.jsx'
      - 'src/components/PremiumVisualSystem.css'
      - 'src/components/ui/Ic.jsx'
      - 'personal/src/**'
      - 'tests/visual/**'
      - 'package*.json'
      - '.github/workflows/pol-vita-010-visual.yml'
permissions:
  contents: read
jobs:
  iphone-agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:agenda:visual
        env:
          AGENDA_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - run: npm run test:agenda:reliability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agenda-iphone-comparisons
          path: |
            tests/visual/results/
            tests/visual/results-reliability/
