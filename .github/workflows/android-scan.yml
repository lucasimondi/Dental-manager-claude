name: Android Scan (ML Kit)
on:
  pull_request:
    branches: [master]
    paths: ['android/scan/**', 'personal/src/lib/nativo.js', '.github/workflows/android-scan.yml']
  # After a merge the tested APK is published as a plain .apk file (no zip) at a fixed release link.
  push:
    branches: [master]
    paths: ['android/scan/**', '.github/workflows/android-scan.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p android/scan :app:assembleDebug :app:lintDebug --no-daemon
      # Installability evidence in the log: signature schemes and the manifest Android will read.
      - name: Verify APK
        run: |
          APK=android/scan/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity|native-code)" || true
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -iE "testOnly|debuggable|minSdk|targetSdk" || true
      - uses: actions/upload-artifact@v4
        with:
          name: poliedra-scan-debug-apk
          path: android/scan/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  publish:
    # Only code already on master; pull requests never publish.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: poliedra-scan-debug-apk
      - name: Publish to the scan-android release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app-debug.apk poliedra-scan.apk
          gh release view scan-android >/dev/null 2>&1 || gh release create scan-android --target "$GITHUB_SHA" --prerelease \
            --title "Poliedra Scan (Android)" --notes "APK di prova di Poliedra Scan (scanner Google ML Kit), aggiornato a ogni modifica su master. Scarica poliedra-scan.apk e aprilo direttamente: non c'è nessuno zip da estrarre."
          gh release upload scan-android poliedra-scan.apk --clobber
          gh release edit scan-android --notes "APK di prova di Poliedra Scan con scanner Google ML Kit (commit ${GITHUB_SHA::7}). Scarica poliedra-scan.apk e aprilo direttamente: non c'è nessuno zip da estrarre. Firmato in debug: è una versione di prova, non quella del Play Store."
