name: Poliedron MCP tests
on:
  push:
    branches:
      - codex/poliedron-chatgpt-connector
  pull_request:
    paths:
      - 'integrations/chatgpt-mcp/**'
      - '.github/workflows/poliedron-mcp-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/chatgpt-mcp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm test

  remote-smoke:
    # Live Vercel deployment verification after Node 22 rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check staging health endpoint
        shell: bash
        run: |
          set -euo pipefail
          base=https://poliedron-chatgpt-mcp-staging.vercel.app
          status=$(curl -sS --max-time 20 -D /tmp/health-headers -o /tmp/health-body -w '%{http_code}' "$base/health")
          echo "health status: $status"
          cat /tmp/health-headers
          head -c 500 /tmp/health-body || true
          echo
          test "$status" = 200
          python3 -c 'import json; assert json.load(open("/tmp/health-body")).get("status") == "ok"'
      - name: Check unauthenticated MCP returns 401
        shell: bash
        run: |
          set -euo pipefail
          base=https://poliedron-chatgpt-mcp-staging.vercel.app
          status=$(curl -sS --max-time 20 -D /tmp/mcp-headers -o /tmp/mcp-body -w '%{http_code}' -X POST "$base/mcp" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          echo "unauthenticated MCP status: $status"
          cat /tmp/mcp-headers
          head -c 500 /tmp/mcp-body || true
          echo
          test "$status" = 401
