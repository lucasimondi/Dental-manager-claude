name: Personal PDF Android
on:
  pull_request:
    paths:
      - 'personal/**'
      - 'public/personal*'
      - 'public/personal/**'
      - 'public/poliedron/personal/**'
      - 'tests/personalPdf*'
      - 'tests/visual/personal-pdf*'
      - 'package*.json'
      - '.github/workflows/personal-pdf.yml'
permissions:
  contents: read
jobs:
  pixel7-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run build:personal
      - run: node tests/visual/personal-pdf.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-pdf-pixel7
          path: tests/visual/results-personal-pdf
          if-no-files-found: ignore
