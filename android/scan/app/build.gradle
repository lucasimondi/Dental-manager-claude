plugins { id 'com.android.application' }
android {
    namespace 'it.poliedrasoft.scan'
    compileSdk 35
    defaultConfig { applicationId 'it.poliedrasoft.scan'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    // Scanner documenti di Google (ML Kit): fotocamera, bordi, raddrizzamento, ombre; tutto sul telefono.
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'
}
