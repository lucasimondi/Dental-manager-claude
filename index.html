const TABLE_MAP={
dm_p:'patients',
dm_pl:'plans',
dm_py:'payments',
dm_a:'appointments',
dm_pr:'pricelist',
dm_tp:'templates',
dm_at:'app_types',

/* ── CONVERSIONE CAMPI: app (camelCase) <-> db (snake_case) ── */
const FIELD_MAP={
patients:{dataNascita:'data_nascita'},
plans:{pazienteId:'paziente_id',scontoTipo:'sconto_tipo'},
payments:{pazienteId:'paziente_id'},
appointments:{pazienteId:'paziente_id'},
};
const toDb=(table,obj)=>{
const map=FIELD_MAP[table]||{};
const out={};
Object.keys(obj).forEach(k=>{
if(k==='id')return;
const dbKey=map[k]||k;
out[dbKey]=obj[k];
});
return out;
};
const fromDb=(table,row)=>{
const map=FIELD_MAP[table]||{};
const rev={};
Object.entries(map).forEach(([app,db])=>{rev[db]=app;});
const out={id:row.id};
Object.keys(row).forEach(k=>{
if(k==='id'||k==='user_id'||k==='created_at')return;
const appKey=rev[k]||k;
out[appKey]=row[k];
});
return out;
};

/* ── DB: sostituisce LS, stessa interfaccia ma async + cloud ── */
const DB={
async getAll(key){
const table=TABLE_MAP[key];
if(!table)return null;
const {data,error}=await supabase.from(table).select('*').order('id',{ascending:true});
if(error){console.error('DB.getAll',table,error);return [];}
return (data||[]).map(r=>fromDb(table,r));
},
async insert(key,obj){
const table=TABLE_MAP[key];
const {data:{user}}=await supabase.auth.getUser();
const payload={...toDb(table,obj),user_id:user.id};
const {data,error}=await supabase.from(table).insert(payload).select().single();
if(error){console.error('DB.insert',table,error);throw error;}
return fromDb(table,data);
},
async update(key,id,obj){
const table=TABLE_MAP[key];
const payload=toDb(table,obj);
const {error}=await supabase.from(table).update(payload).eq('id',id);
if(error){console.error('DB.update',table,error);throw error;}
},
async remove(key,id){
const table=TABLE_MAP[key];
const {error}=await supabase.from(table).delete().eq('id',id);
if(error){console.error('DB.remove',table,error);throw error;}
},
async replaceAll(key,arr){
const table=TABLE_MAP[key];
const {data:{user}}=await supabase.auth.getUser();
await supabase.from(table).delete().eq('user_id',user.id);
if(arr.length===0)return;
const payload=arr.map(o=>({...toDb(table,o),user_id:user.id}));
const {error}=await supabase.from(table).insert(payload);
if(error){console.error('DB.replaceAll',table,error);throw error;}
},
async getStudioInfo(){
const {data:{user}}=await supabase.auth.getUser();
if(!user)return null;
const {data,error}=await supabase.from('studio_info').select('*').eq('user_id',user.id).maybeSingle();
if(error){console.error('DB.getStudioInfo',error);return null;}
if(!data)return null;
const {user_id,updated_at,...rest}=data;
return rest;
},
async setStudioInfo(obj){
const {data:{user}}=await supabase.auth.getUser();
const payload={...obj,user_id:user.id,updated_at:new Date().toISOString()};
const {error}=await supabase.from('studio_info').upsert(payload,{onConflict:'user_id'});
if(error){console.error('DB.setStudioInfo',error);throw error;}
},
};

/* ── PDF PREVENTIVO ── */
const PdfView=({pl,paz,si,onClose})=>{
const sub=pl.voci.reduce((s,v)=>s+Number(v.prezzo),0);
const sc=Number(pl.sconto)||0;
const scontato=pl.scontoTipo==='pct'?sub*(sc/100):Math.min(sc,sub);
const tot=Math.max(0,sub-scontato);
const fmtE=n=>`€ ${Number(n).toFixed(2)}`;

// Testo preventivo per condivisione
const buildTesto=()=>{
const righe=pl.voci.map((v,i)=>`${i+1}. ${v.prestazione}${v.dente?' (d.'+v.dente+')':''} — ${fmtE(v.prezzo)}${v.eseguita?' ✓':''}`).join('\n');
const scontoR=scontato>0?`\n🏷️ Sconto: −${fmtE(scontato)}`:'';
return `🦷 *${si.nome||'Studio Dentistico'}*\n${si.spec||''}\n${'─'.repeat(32)}\n\n📋 *PREVENTIVO*\nPaziente: ${paz?.nome||''} ${paz?.cognome||''}\nData: ${new Date().toLocaleDateString('it-IT')}\nN°: ${String(pl.id||'').slice(-6).padStart(6,'0')}\n\nPiano: *${pl.titolo}*\n\n${righe}${scontoR}\n${'─'.repeat(32)}\n💰 *TOTALE: ${fmtE(tot)}*\n${'─'.repeat(32)}\n📞 ${si.tel||''}  ✉️ ${si.email||''}\n${si.addr1||''}`;
};

const sendWA=()=>{
const tel=(paz?.telefono||'').replace(/\D/g,'');
const msg=encodeURIComponent(buildTesto());
const url=tel?`https://wa.me/39${tel}?text=${msg}`:`https://wa.me/?text=${msg}`;
window.open(url,'_blank');
};

const sendEmail=()=>{
const sogg=encodeURIComponent(`Preventivo – ${paz?.nome||''} ${paz?.cognome||''}`);
const corpo=encodeURIComponent(buildTesto().replace(/\*/g,''));
const dest=paz?.email||'';
window.open(`mailto:${dest}?subject=${sogg}&body=${corpo}`);
};

const shareNativo=async()=>{
if(!navigator.share){sendWA();return;}
try{
await navigator.share({title:`Preventivo ${paz?.nome||''} ${paz?.cognome||''}`,text:buildTesto()});
}catch(e){if(e.name!=='AbortError')sendWA();}
};

const [generating,setGenerating]=useState(false);
const [pdfMsg,setPdfMsg]=useState(null); // {type:'error'|'info', text}

const generaPdf=()=>{
if(generating)return;
setPdfMsg(null);

// La libreria è caricata in <head>, quindi a questo punto deve già essere pronta.
// IMPORTANTE: nessun setTimeout/await prima di window.open(), altrimenti il browser
// blocca il popup perché non è più collegato sincronamente al click dell'utente.
if(typeof window.jspdf==='undefined'||typeof window.jspdf.jsPDF==='undefined'){
setPdfMsg({type:'error',text:'Libreria PDF non ancora caricata. Attendi qualche secondo e riprova, oppure verifica la connessione internet.'});
return;
}
setGenerating(true);
buildAndSave();
};

const buildAndSave=()=>{
try{
const {jsPDF}=window.jspdf;
const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
const W=210,margin=14;
const contentW=W-margin*2;
let y=18;

const txt=(t,x,yy,opts={})=>doc.text(String(t??''),x,yy,opts);
const hLine=(yy)=>{doc.setDrawColor(203,213,224);doc.setLineWidth(0.3);doc.line(margin,yy,W-margin,yy);};
const box=(x,yy,w,h,r,g,b)=>{doc.setFillColor(r,g,b);doc.rect(x,yy,w,h,'F');};

// intestazione
doc.setFont('helvetica','bolditalic');doc.setFontSize(22);doc.setTextColor(26,78,102);
txt(si.nome||'Studio Dentistico',W/2,y,{align:'center'});y+=7;
if(si.spec){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(74,144,196);txt(si.spec,W/2,y,{align:'center'});y+=5;}
if(si.iscr){doc.setFontSize(8);txt(si.iscr,W/2,y,{align:'center'});y+=5;}
y+=2;
doc.setFontSize(8);doc.setTextColor(74,85,104);
const contatti=[si.tel&&`Tel: ${si.tel}`,si.email,si.piva&&`P.IVA ${si.piva}`].filter(Boolean);
txt(contatti.join('   |   '),W/2,y,{align:'center'});y+=3;
hLine(y);y+=5;

// meta
box(margin,y,contentW,16,247,250,252);
doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(113,128,150);
txt('DATA',margin+3,y+4);txt('PAZIENTE',W/2,y+4,{align:'center'});txt('N° PREVENTIVO',W-margin-3,y+4,{align:'right'});
doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(26,32,44);
txt(new Date().toLocaleDateString('it-IT'),margin+3,y+10);
txt(`${paz?.nome||''} ${paz?.cognome||''}`,W/2,y+10,{align:'center'});
txt(String(pl.id||'').slice(-6).padStart(6,'0'),W-margin-3,y+10,{align:'right'});
y+=20;

if(paz?.cf||paz?.dataNascita){
doc.setFontSize(8);doc.setTextColor(113,128,150);
const cf=[paz.cf&&`C.F.: ${paz.cf}`,paz.dataNascita&&`Nato il: ${new Date(paz.dataNascita+'T12:00').toLocaleDateString('it-IT')}`].filter(Boolean);
txt(cf.join('   '),W/2,y,{align:'center'});y+=6;
}

// titolo
doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(26,32,44);
const tw=doc.getTextWidth('PREVENTIVO')+10;
doc.setDrawColor(26,32,44);doc.setLineWidth(0.5);
doc.rect(W/2-tw/2,y-5,tw,8);
txt('PREVENTIVO',W/2,y,{align:'center'});y+=10;

doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(74,144,196);
txt(`PIANO DI CURA: ${(pl.titolo||'').toUpperCase()}`,margin,y);
doc.setDrawColor(74,144,196);doc.setLineWidth(0.4);doc.line(margin,y+2,W-margin,y+2);
y+=7;

// tabella
const cols=[8,82,18,28,24];
const heads=['#','Prestazione','Dente','Importo','Stato'];
box(margin,y,contentW,7,26,107,138);
doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(255,255,255);
let cx=margin+2;
heads.forEach((h,i)=>{txt(h,cx,y+5);cx+=cols[i];});
y+=7;

doc.setFont('helvetica','normal');doc.setFontSize(9);
pl.voci.forEach((v,i)=>{
// nuova pagina se serve
if(y>270){doc.addPage();y=18;}
const rowH=7;
if(i%2===0)box(margin,y,contentW,rowH,247,250,252);else box(margin,y,contentW,rowH,255,255,255);
doc.setTextColor(26,32,44);
cx=margin+2;
txt(String(i+1),cx,y+5);cx+=cols[0];
const prest=doc.splitTextToSize(v.prestazione,cols[1]-3)[0]||'';
txt(prest,cx,y+5);cx+=cols[1];
txt(v.dente||'—',cx,y+5);cx+=cols[2];
txt(`€ ${Number(v.prezzo).toFixed(2)}`,cx,y+5);cx+=cols[3];
if(v.eseguita){box(cx-1,y+1,cols[4]-2,5,232,247,238);doc.setTextColor(45,158,97);txt('Eseguita',cx+1,y+5);}
else{box(cx-1,y+1,cols[4]-2,5,254,243,226);doc.setTextColor(224,128,64);txt('Da fare',cx+1,y+5);}
y+=rowH;
});

if(scontato>0){
box(margin,y,contentW,7,240,255,244);
doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(45,158,97);
txt(`Sconto ${pl.scontoTipo==='pct'?sc+'%':'€ '+Number(sc).toFixed(2)}`,margin+2,y+5);
txt(`−€ ${scontato.toFixed(2)}`,W-margin-3,y+5,{align:'right'});
y+=7;
}

box(margin,y,contentW,9,235,248,255);
doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(26,107,138);
txt('TOTALE',margin+3,y+6);
txt(`€ ${tot.toFixed(2)}`,W-margin-3,y+6,{align:'right'});
y+=13;

if(paz?.note){
if(y>265){doc.addPage();y=18;}
y+=2;
const noteLines=doc.splitTextToSize(paz.note,contentW-30);
const boxH=Math.max(10,6+noteLines.length*4);
box(margin,y,contentW,boxH,255,251,235);
doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(120,53,15);
txt('Note cliniche:',margin+2,y+4);
doc.setFont('helvetica','normal');
noteLines.forEach((ln,li)=>txt(ln,margin+2,y+4+(li+1)*4));
y+=boxH+4;
}

// footer
if(y>275){doc.addPage();y=18;}
y+=4;hLine(y);y+=4;
doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(74,85,104);
const foot=[si.tel&&`Tel: ${si.tel}`,si.addr1,si.addr2,si.email].filter(Boolean);
txt(foot.join('   |   '),W/2,y,{align:'center'});

const nomeFile=`preventivo_${(paz?.cognome||'paziente').replace(/\s+/g,'_')}_${String(pl.id||Date.now()).slice(-6)}.pdf`.toLowerCase();

// Rileva iOS Safari (dove i blob-download sono inaffidabili)
const ua=navigator.userAgent||'';
const isIOS=/iPad|iPhone|iPod/.test(ua)||(ua.includes('Mac')&&'ontouchend' in document);
const isSafari=/^((?!chrome|android|crios|fxios).)*safari/i.test(ua);

let ok=false;

// Metodo 1: su iOS/Safari, apri il PDF in una nuova scheda via data URI (massima compatibilità)
if(isIOS||isSafari){
try{
const dataUri=doc.output('datauristring',{filename:nomeFile});
const w=window.open();
if(w){
w.document.write(`<!DOCTYPE html><html><head><title>${nomeFile}</title><style>body{margin:0}embed{width:100%;height:100vh}</style></head><body><embed src="${dataUri}" type="application/pdf"/></body></html>`);
w.document.close();
ok=true;
setPdfMsg({type:'info',text:'✓ PDF aperto in una nuova scheda. Usa il pulsante di condivisione/salvataggio del browser per scaricarlo.'});
}
}catch(e1){console.error('Metodo dataURI fallito:',e1);}
}

// Metodo 2: Blob + link download (Chrome/Android/Desktop)
if(!ok){
try{
const blob=doc.output('blob');
const blobUrl=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=blobUrl;
a.download=nomeFile;
a.style.display='none';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
setTimeout(()=>URL.revokeObjectURL(blobUrl),5000);
ok=true;
setPdfMsg({type:'info',text:'✓ PDF scaricato. Controlla la cartella Download del dispositivo.'});
}catch(e2){console.error('Metodo blob fallito:',e2);}
}

// Metodo 3: ultimo fallback, save diretto di jsPDF
if(!ok){
try{
doc.save(nomeFile);
ok=true;
setPdfMsg({type:'info',text:'✓ PDF generato.'});
}catch(e3){
console.error('Tutti i metodi falliti:',e3);
setPdfMsg({type:'error',text:'Impossibile generare il PDF su questo dispositivo. Usa WhatsApp o Email per condividere il preventivo come testo.'});
}
}
}catch(err){
console.error('Errore PDF:',err);
setPdfMsg({type:'error',text:'Errore nella generazione del PDF: '+(err&&err.message?err.message:String(err))});
}finally{
setGenerating(false);
}
};

const mInc=payments.filter(p=>p.data&&p.data.startsWith(t.slice(0,7))).reduce((s,p)=>s+Number(p.importo),0);
const upcoming=[...appointments].filter(a=>a.data>=t).sort((a,b)=>a.data.localeCompare(b.data)||a.ora.localeCompare(b.ora)).slice(0,6);

// ── LOGICA UNICA: basata su voci.eseguita / voci.incassata (stessa dei bottoni scheda paziente)
// "Da incassare" = voci con eseguita=true, incassata=false
// "Incassate anno" = voci con incassata=true e dataEsec nell'anno corrente

// raggruppa per paziente
const saldoPerPaz=patients.map(paz=>{
const patPlans=plans.filter(pl=>pl.pazienteId===paz.id);
const vociDaInc=patPlans.flatMap(pl=>
pl.voci.filter(v=>v.eseguita&&!v.incassata).map(v=>({...v,pianoTitolo:pl.titolo,pianoId:pl.id}))
);
const vociIncAnno=patPlans.flatMap(pl=>
pl.voci.filter(v=>v.incassata&&v.dataEsec&&v.dataEsec.startsWith(anno)).map(v=>({...v,pianoTitolo:pl.titolo}))
);
const totDaInc=vociDaInc.reduce((s,v)=>s+Number(v.prezzo),0);
const totIncAnno=vociIncAnno.reduce((s,v)=>s+Number(v.prezzo),0);
return {paz,vociDaInc,vociIncAnno,totDaInc,totIncAnno};
}).filter(x=>x.totDaInc>0||x.totIncAnno>0);

const totDaInc=saldoPerPaz.reduce((s,x)=>s+x.totDaInc,0);
const totIncAnno=saldoPerPaz.reduce((s,x)=>s+x.totIncAnno,0);
const nPazDaInc=saldoPerPaz.filter(x=>x.totDaInc>0).length;
const nPazInc=saldoPerPaz.filter(x=>x.totIncAnno>0).length;

const righeDAInc=saldoPerPaz.filter(x=>x.totDaInc>0).sort((a,b)=>b.totDaInc-a.totDaInc);
const righeInc=saldoPerPaz.filter(x=>x.totIncAnno>0).sort((a,b)=>b.totIncAnno-a.totIncAnno);

return <div>
{/* MODAL DA INCASSARE */}
{detailModal==='daInc'&&<Modal title="⚠️ Da incassare — tutti i pazienti" onClose={()=>setDetailModal(null)} wide>
<div style={{background:C.danL,borderRadius:10,padding:'10px 14px',marginBottom:12,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
<span style={{fontSize:13,fontWeight:700,color:C.dan}}>Totale da incassare</span>
<span style={{fontSize:20,fontWeight:900,color:C.dan}}>{fmt(totDaInc)}</span>
</div>
{righeDAInc.length===0&&<div style={{textAlign:'center',color:C.txl,padding:30}}>Nessun residuo 🎉</div>}
{righeDAInc.map(({paz,totDaInc:tot,vociDaInc})=>(
<Crd key={paz.id} style={{marginBottom:10,borderLeft:`3px solid ${C.dan}`}}>
<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:8}}>
<div>
<div
onClick={()=>{setDetailModal(null);onOpenPaz(paz,'paga');}}
style={{fontWeight:700,fontSize:14,color:C.pri,cursor:'pointer',textDecoration:'underline',textDecorationColor:C.pri+'60'}}>
{paz.nome} {paz.cognome} ›
</div>
{paz.telefono&&<div style={{fontSize:11,color:C.txm}}>📞 {paz.telefono}</div>}
</div>
<div style={{textAlign:'right'}}>
<div style={{fontSize:18,fontWeight:900,color:C.dan}}>{fmt(tot)}</div>
<div style={{fontSize:10,color:C.txm}}>{vociDaInc.length} prestazion{vociDaInc.length===1?'e':'i'}</div>
</div>
</div>
{vociDaInc.map((v,i)=>(
<div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',padding:'6px 0',borderTop:`1px solid ${C.brd}`,fontSize:12,gap:8}}>
<div style={{minWidth:0,flex:1}}>
<div style={{fontWeight:600}}>{v.prestazione}{v.dente?` · d.${v.dente}`:''}</div>
<div style={{fontSize:10,color:C.txl}}>{v.pianoTitolo}{v.dataEsec?` · eseguita ${fmtD(v.dataEsec)}`:''}</div>
</div>
<span style={{fontWeight:800,color:C.dan,flexShrink:0}}>{fmt(v.prezzo)}</span>
</div>
))}
</Crd>
))}
</Modal>}

{/* MODAL INCASSATE ANNO */}
{detailModal==='inc'&&<Modal title={`✓ Incassate ${anno} — tutti i pazienti`} onClose={()=>setDetailModal(null)} wide>
<div style={{background:C.sucL,borderRadius:10,padding:'10px 14px',marginBottom:12,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
<span style={{fontSize:13,fontWeight:700,color:C.suc}}>Totale incassato {anno}</span>
<span style={{fontSize:20,fontWeight:900,color:C.suc}}>{fmt(totIncAnno)}</span>
</div>
{righeInc.length===0&&<div style={{textAlign:'center',color:C.txl,padding:30}}>Nessun incasso registrato</div>}
{righeInc.map(({paz,totIncAnno:tot,vociIncAnno})=>(
<Crd key={paz.id} style={{marginBottom:10,borderLeft:`3px solid ${C.suc}`}}>
<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:6}}>
<div>
<div
onClick={()=>{setDetailModal(null);onOpenPaz(paz,'paga');}}
style={{fontWeight:700,fontSize:14,color:C.pri,cursor:'pointer',textDecoration:'underline',textDecorationColor:C.pri+'60'}}>
{paz.nome} {paz.cognome} ›
</div>
{paz.telefono&&<div style={{fontSize:11,color:C.txm}}>📞 {paz.telefono}</div>}
</div>
<div style={{textAlign:'right'}}>
<div style={{fontSize:18,fontWeight:900,color:C.suc}}>{fmt(tot)}</div>
<div style={{fontSize:10,color:C.txm}}>{vociIncAnno.length} prestazion{vociIncAnno.length===1?'e':'i'}</div>
</div>
</div>
{vociIncAnno.map((v,i)=>(
<div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',padding:'6px 0',borderTop:`1px solid ${C.brd}`,fontSize:12,gap:8}}>
<div style={{minWidth:0,flex:1}}>
<div style={{fontWeight:600}}>{v.prestazione}{v.dente?` · d.${v.dente}`:''}</div>
<div style={{fontSize:10,color:C.txl}}>{v.pianoTitolo}{v.dataEsec?` · ${fmtD(v.dataEsec)}`:''}</div>
</div>
<span style={{fontWeight:800,color:C.suc,flexShrink:0}}>{fmt(v.prezzo)}</span>
</div>
))}
</Crd>
))}
</Modal>}

<div style={{marginBottom:18}}>
<div style={{fontSize:20,fontWeight:800,color:C.txt}}>Buongiorno 👋</div>
<div style={{fontSize:13,color:C.txl,marginTop:2}}>{fmtD(t)}</div>
</div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
<Crd style={{display:'flex',alignItems:'center',gap:12,padding:12}}><div style={{background:C.priL,borderRadius:10,padding:9}}><Ic n="pz" s={20} c={C.pri}/></div><div><div style={{fontSize:19,fontWeight:800}}>{patients.length}</div><div style={{fontSize:11,color:C.txm,fontWeight:600}}>Pazienti</div></div></Crd>
<Crd style={{display:'flex',alignItems:'center',gap:12,padding:12}}><div style={{background:'#E8FAF9',borderRadius:10,padding:9}}><Ic n="cal" s={20} c={C.acc}/></div><div><div style={{fontSize:19,fontWeight:800}}>{todayApps.length}</div><div style={{fontSize:11,color:C.txm,fontWeight:600}}>Oggi</div></div></Crd>
<Crd style={{display:'flex',alignItems:'center',gap:12,padding:12}}><div style={{background:C.sucL,borderRadius:10,padding:9}}><Ic n="eur" s={20} c={C.suc}/></div><div><div style={{fontSize:17,fontWeight:800}}>{fmt(mInc)}</div><div style={{fontSize:11,color:C.txm,fontWeight:600}}>Incasso mese</div></div></Crd>
<Crd style={{display:'flex',alignItems:'center',gap:12,padding:12}}><div style={{background:'#FEF3E2',borderRadius:10,padding:9}}><Ic n="plan" s={20} c={C.war}/></div><div><div style={{fontSize:19,fontWeight:800}}>{plans.flatMap(pl=>pl.voci.filter(v=>!v.eseguita)).length}</div><div style={{fontSize:11,color:C.txm,fontWeight:600}}>Da eseguire</div></div></Crd>
</div>

{/* SEMAFORO CLICCABILE */}
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
<div onClick={()=>setDetailModal('daInc')} style={{background:C.danL,borderRadius:12,padding:14,border:`1px solid ${C.dan}40`,cursor:'pointer',position:'relative',userSelect:'none'}}>
<div style={{position:'absolute',top:10,right:10,fontSize:14,opacity:0.5}}>›</div>
<div style={{fontSize:10,fontWeight:800,color:C.dan,textTransform:'uppercase',letterSpacing:'0.06em'}}>⚠️ Da incassare</div>
<div style={{fontSize:22,fontWeight:900,color:C.dan,marginTop:4}}>{fmt(totDaInc)}</div>
<div style={{fontSize:11,color:C.dan+'BB',marginTop:2}}>{nPazDaInc} pazienti · tocca per dettagli</div>
</div>
<div onClick={()=>setDetailModal('inc')} style={{background:C.sucL,borderRadius:12,padding:14,border:`1px solid ${C.suc}40`,cursor:'pointer',position:'relative',userSelect:'none'}}>
<div style={{position:'absolute',top:10,right:10,fontSize:14,opacity:0.5}}>›</div>
<div style={{fontSize:10,fontWeight:800,color:C.suc,textTransform:'uppercase',letterSpacing:'0.06em'}}>✓ Incassate {anno}</div>
<div style={{fontSize:22,fontWeight:900,color:C.suc,marginTop:4}}>{fmt(totIncAnno)}</div>
<div style={{fontSize:11,color:C.suc+'BB',marginTop:2}}>{nPazInc} pazienti · tocca per dettagli</div>
</div>
</div>

<Crd>
<div style={{fontWeight:700,fontSize:14,marginBottom:10}}>Prossimi appuntamenti</div>
{upcoming.length===0&&<div style={{color:C.txl,fontSize:13,textAlign:'center',padding:'14px 0'}}>Nessun appuntamento</div>}
{upcoming.map(a=>{
const p=patients.find(x=>x.id===a.pazienteId);
return <div key={a.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 0',borderBottom:`1px solid ${C.brd}`}}>
<div style={{background:C.priL,borderRadius:8,padding:'5px 7px',textAlign:'center',minWidth:40,flexShrink:0}}>
<div style={{fontSize:10,color:C.pri,fontWeight:700}}>{a.data.slice(8)}/{a.data.slice(5,7)}</div>
<div style={{fontSize:12,color:C.priD,fontWeight:800}}>{a.ora}</div>
</div>
<div style={{flex:1,minWidth:0}}>
<div style={{fontSize:13,fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p?`${p.nome} ${p.cognome}`:'—'}</div>
<div style={{fontSize:12,color:C.txm}}>{a.tipo}</div>
</div>
<Bdg ch={a.stato} co={a.stato==='confermato'?C.suc:C.war}/>
</div>;
})}
</Crd>
</div>;
};

/* ── SCHEDA PAZIENTE ── */
const SchedaPaz=({paz,plans,payments,appointments,si,onClose,onEdit,onNuovoPiano,setPlans,initTab})=>{
const [tab,setTab]=useState(initTab||'info');
const [pdfPlan,setPdfPlan]=useState(null);
const [selPiani,setSelPiani]=useState([]);
const [editPianoModal,setEditPianoModal]=useState(null);
const [editForm,setEditForm]=useState(null);
const [confirmDelId,setConfirmDelId]=useState(null);

const patPlans=plans.filter(pl=>pl.pazienteId===paz.id);
const patPay=[...payments.filter(p=>p.pazienteId===paz.id)].reverse();
const patApp=[...appointments.filter(a=>a.pazienteId===paz.id)].sort((a,b)=>b.data.localeCompare(a.data));

const totDovuto=patPlans.reduce((s,pl)=>{
const sub=pl.voci.reduce((a,v)=>a+Number(v.prezzo),0);
const sc=Number(pl.sconto)||0;
const scontato=pl.scontoTipo==='pct'?sub*(sc/100):Math.min(sc,sub);
return s+Math.max(0,sub-scontato);
},0);
const totPaid=patPay.reduce((s,p)=>s+Number(p.importo),0);
const totDaPagare=Math.max(0,totDovuto-totPaid);
const pctPagato=totDovuto>0?Math.min(100,Math.round(totPaid/totDovuto*100)):0;

const toggleEseguita=(plId,i)=>setPlans(prev=>prev.map(pl=>{
if(pl.id!==plId)return pl;
const nuoveVoci=pl.voci.map((v,j)=>j===i?{...v,eseguita:!v.eseguita,dataEsec:!v.eseguita?today():null,incassata:!v.eseguita?v.incassata:false}:v);
const tutteEseguite=nuoveVoci.every(v=>v.eseguita);
return {...pl,voci:nuoveVoci,stato:tutteEseguite?'concluso':(pl.stato==='concluso'?'attivo':pl.stato)};
}));
const toggleIncassata=(plId,i)=>setPlans(prev=>prev.map(pl=>pl.id===plId?{...pl,voci:pl.voci.map((v,j)=>j===i?{...v,incassata:!v.incassata}:v)}:pl));
const delPiano=id=>{
setConfirmDelId(prev=>prev===id?null:id);
};
const confirmDel=id=>{
setPlans(p=>p.filter(pl=>pl.id!==id));
setConfirmDelId(null);
};

// Modifica piano
const openEdit=pl=>{
setEditForm({...pl,sconto:pl.sconto||0,scontoTipo:pl.scontoTipo||'pct'});
setEditPianoModal(pl.id);
};
const saveEdit=()=>{
if(!editForm.titolo)return;
setPlans(p=>p.map(pl=>pl.id===editPianoModal?{...pl,...editForm}:pl));
setEditPianoModal(null);
};
const delVoceEdit=i=>setEditForm(f=>({...f,voci:f.voci.filter((_,j)=>j!==i)}));

// Selezione piani
const toggleSel=id=>setSelPiani(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
const selAll=()=>setSelPiani(patPlans.map(p=>p.id));
const deselAll=()=>setSelPiani([]);

// PDF multi-piano: crea un piano virtuale combinato e apre stampa
const generaPdfMulti=()=>{
const pianiSel=patPlans.filter(pl=>selPiani.includes(pl.id));
if(!pianiSel.length)return;
const vociTot=pianiSel.flatMap(pl=>pl.voci);
const totSconti=pianiSel.reduce((s,pl)=>{
const sub=pl.voci.reduce((a,v)=>a+Number(v.prezzo),0);
const sc=Number(pl.sconto)||0;
return s+(pl.scontoTipo==='pct'?sub*(sc/100):Math.min(sc,sub));
},0);
const virtuale={id:'multi',titolo:pianiSel.length===1?pianiSel[0].titolo:`Preventivo combinato (${pianiSel.length} piani)`,data:today(),voci:vociTot,sconto:totSconti,scontoTipo:'eur',stato:'attivo',pazienteId:paz.id};
setPdfPlan(virtuale);
};

if(pdfPlan)return <PdfView pl={pdfPlan} paz={paz} si={si} onClose={()=>setPdfPlan(null)}/>;

const TABS=[{id:'info',l:'📋 Info'},{id:'piani',l:'🦷 Piani'},{id:'paga',l:'💰 Pagamenti'},{id:'app',l:'📅 Agenda'}];
return <div style={{position:'fixed',inset:0,background:C.bg,zIndex:500,display:'flex',flexDirection:'column'}}>
<div style={{background:C.priD,padding:'12px 14px',paddingTop:'max(12px,env(safe-area-inset-top))',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
<button onClick={onClose} style={{background:'rgba(255,255,255,0.12)',border:'none',borderRadius:8,padding:8,cursor:'pointer',display:'flex'}}><Ic n="back" s={18} c="#fff"/></button>
<div style={{flex:1,minWidth:0}}>
<div style={{color:'#fff',fontWeight:800,fontSize:15,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{paz.nome} {paz.cognome}</div>
{paz.cf&&<div style={{color:'rgba(255,255,255,0.6)',fontSize:11,fontFamily:'monospace'}}>{paz.cf}</div>}
</div>
<button onClick={()=>onEdit(paz)} style={{background:'rgba(255,255,255,0.15)',border:'none',borderRadius:8,padding:'6px 11px',cursor:'pointer',color:'#fff',fontWeight:700,fontSize:12,display:'flex',alignItems:'center',gap:4}}><Ic n="edit" s={13} c="#fff"/>Modifica</button>
</div>
<div style={{background:C.priD,display:'flex',borderTop:'1px solid rgba(255,255,255,0.1)',flexShrink:0}}>
{[{l:'Piani',v:patPlans.length},{l:'Pagato',v:fmt(totPaid)},{l:'Da pagare',v:fmt(totDaPagare)},{l:'Visite',v:patApp.length}].map(s=>(
<div key={s.l} style={{flex:1,textAlign:'center',padding:'8px 2px',borderRight:'1px solid rgba(255,255,255,0.1)'}}>
<div style={{color:s.l==='Da pagare'&&totDaPagare>0?'#FCA5A5':'#fff',fontWeight:800,fontSize:12}}>{s.v}</div>
<div style={{color:'rgba(255,255,255,0.55)',fontSize:9}}>{s.l}</div>
</div>
))}
</div>
<div style={{display:'flex',background:C.sur,borderBottom:`1px solid ${C.brd}`,flexShrink:0}}>
{TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:'11px 4px',background:'none',border:'none',borderBottom:`2.5px solid ${tab===t.id?C.pri:'transparent'}`,color:tab===t.id?C.pri:C.txm,fontWeight:tab===t.id?700:500,fontSize:11,cursor:'pointer',whiteSpace:'nowrap'}}>{t.l}</button>)}
</div>

<div style={{flex:1,overflowY:'auto',padding:14}}>

{/* ── TAB INFO ── */}
{tab==='info'&&<div>
{paz.telefono&&<Crd style={{marginBottom:10}}><div style={{fontWeight:700,fontSize:13}}>📞 {paz.telefono}</div><PhStr tel={paz.telefono}/></Crd>}
<Crd style={{marginBottom:10}}>
<div style={{fontSize:11,fontWeight:700,color:C.pri,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8}}>Anagrafica</div>
{[['Nascita',fmtD(paz.dataNascita)],['C.F.',paz.cf||'—'],['Indirizzo',paz.indirizzo||'—'],['Email',paz.email||'—']].map(([l,v])=>(
<div key={l} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:`1px solid ${C.brd}`,gap:10}}>
<span style={{fontSize:11,color:C.txm,fontWeight:600,flexShrink:0}}>{l}</span>
<span style={{fontSize:12,color:C.txt,textAlign:'right',wordBreak:'break-word'}}>{v}</span>
</div>
))}
</Crd>
{paz.note&&<Crd style={{background:'#FFFBEB',border:'1px solid #FCD34D'}}>
<div style={{fontSize:11,fontWeight:700,color:'#92400E',textTransform:'uppercase',marginBottom:5}}>⚠️ Note cliniche</div>
<div style={{fontSize:13,color:'#78350F',lineHeight:1.6}}>{paz.note}</div>
</Crd>}
</div>}

{/* ── TAB PIANI ── */}
{tab==='piani'&&<div>
{/* barra azioni selezione */}
<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,gap:8,flexWrap:'wrap'}}>
<Btn ch="+ Nuovo piano" v="pri" sz="sm" onClick={()=>onNuovoPiano(paz.id)}/>
<div style={{display:'flex',gap:6,alignItems:'center'}}>
{selPiani.length>0
?<><button onClick={deselAll} style={{fontSize:11,fontWeight:700,color:C.txm,background:C.bg,border:`1px solid ${C.brd}`,borderRadius:7,padding:'5px 9px',cursor:'pointer'}}>✕ Deseleziona</button>
<button onClick={generaPdfMulti} style={{fontSize:11,fontWeight:700,color:'#fff',background:C.pri,border:'none',borderRadius:7,padding:'5px 11px',cursor:'pointer',display:'flex',alignItems:'center',gap:4}}><Ic n="prt" s={11} c="#fff"/>PDF ({selPiani.length})</button></>
:<button onClick={selAll} style={{fontSize:11,fontWeight:700,color:C.pri,background:C.priL,border:'none',borderRadius:7,padding:'5px 9px',cursor:'pointer'}}>Seleziona tutti</button>}
</div>
</div>

{patPlans.length===0&&<div style={{textAlign:'center',color:C.txl,padding:40}}>Nessun piano di cura</div>}
{patPlans.map(pl=>{
const sub=pl.voci.reduce((s,v)=>s+Number(v.prezzo),0);
const sc=Number(pl.sconto)||0;
const scontato=pl.scontoTipo==='pct'?sub*(sc/100):Math.min(sc,sub);
const tot=Math.max(0,sub-scontato);
const done=pl.voci.filter(v=>v.eseguita).length;
const pct=pl.voci.length?Math.round(done/pl.voci.length*100):0;
const terminato=pct===100;
const isSel=selPiani.includes(pl.id);
const statoEff=terminato?'concluso':(pl.stato||'attivo');
const statoC={attivo:C.war,accettato:C.acc,concluso:C.suc,rifiutato:C.dan}[statoEff]||C.war;

return <Crd key={pl.id} style={{marginBottom:12,border:`2px solid ${isSel?C.pri:terminato?C.suc+'50':C.brd}`,background:terminato?C.sucL+'40':'#fff'}}>
{/* header piano */}
<div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:8}}>
{/* checkbox selezione */}
<button onClick={()=>toggleSel(pl.id)} style={{marginTop:2,width:22,height:22,borderRadius:6,border:`2px solid ${isSel?C.pri:C.brd}`,background:isSel?C.pri:'#fff',cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',padding:0}}>
{isSel&&<Ic n="ok" s={12} c="#fff"/>}
</button>
<div style={{flex:1,minWidth:0}}>
<div style={{fontWeight:700,fontSize:14,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{pl.titolo}</div>
<div style={{fontSize:11,color:C.txm}}>{fmtD(pl.data)}</div>
<div style={{marginTop:4,display:'flex',gap:5,flexWrap:'wrap',alignItems:'center'}}>
<Bdg ch={terminato?'✓ Terminato':statoEff} co={statoC}/>
{terminato&&<span style={{fontSize:10,color:C.suc,fontWeight:700}}>Tutte le prestazioni eseguite</span>}
</div>
</div>
{/* azioni */}
<div style={{display:'flex',gap:5,flexShrink:0}}>
<button onClick={()=>setPdfPlan(pl)} title="PDF" style={{background:C.priL,border:'none',borderRadius:7,padding:'6px 8px',cursor:'pointer',display:'flex',alignItems:'center',gap:3,color:C.pri,fontWeight:700,fontSize:10}}>

// Parser CSV robusto: gestisce virgolette, virgole dentro i campi, CRLF
const parseCSV=text=>{
const rows=[];
let row=[],field='',inQuotes=false;
const clean=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
for(let i=0;i<clean.length;i++){
const c=clean[i],next=clean[i+1];
if(inQuotes){
if(c==='"'&&next==='"'){field+='"';i++;}
else if(c==='"'){inQuotes=false;}
else field+=c;
}else{
if(c==='"')inQuotes=true;
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else field+=c;
}
}
if(field.length||row.length){row.push(field);rows.push(row);}
return rows.filter(r=>r.length>1||r[0]!=='');
};

// Separa "Cognome NomeCODICE" -> {cognome, nome}. Scarta il codice alfanumerico finale (es. C4571)
const splitNomeKanino=raw=>{
if(!raw)return{cognome:'',nome:''};
// rimuove un codice finale tipo "C4571" (1 lettera maiuscola + 4 cifre) attaccato senza spazio
let s=raw.trim().replace(/[A-Z]\d{4}$/,'').trim();
const parts=s.split(/\s+/);
if(parts.length<2)return{cognome:s,nome:''};
// ultima parola = nome, resto = cognome (gestisce cognomi/nomi composti tipo "Maria Vita")
const nome=parts[parts.length-1];
const cognome=parts.slice(0,-1).join(' ');
// normalizza maiuscole: Prima Lettera Maiuscola, resto minuscolo
const cap=s=>s.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
return{cognome:cap(cognome),nome:cap(nome)};
};

const cleanTelefono=raw=>{
if(!raw)return'';
let t=raw.trim();
// se ci sono due numeri concatenati (es. due "+39"), tiene solo il primo
const matches=t.match(/\+?39[\s\d]{8,}/g);
if(matches&&matches.length>0)t=matches[0];
return t.replace(/\s+/g,' ').trim();
};

const handleFiles=async(fileList)=>{
setError('');
const newFiles=[];
for(const file of fileList){
try{
const text=await file.text();
const rows=parseCSV(text);
if(rows.length<2){continue;}
const header=rows[0].map(h=>h.trim().toLowerCase());
const idxNome=header.findIndex(h=>h.includes('nome'));
const idxCf=header.findIndex(h=>h.includes('fiscale'));
const idxTel=header.findIndex(h=>h.includes('telefono'));
const idxEmail=header.findIndex(h=>h.includes('email'));
const parsed=rows.slice(1).filter(r=>r[idxNome]&&r[idxNome].trim()).map(r=>{
const {cognome,nome}=splitNomeKanino(r[idxNome]||'');
return{
cognome,nome,
cf:(r[idxCf]||'').trim().toUpperCase(),
telefono:cleanTelefono(r[idxTel]||''),
email:(r[idxEmail]||'').trim(),
_raw:r[idxNome],
};
});
newFiles.push({name:file.name,rows:parsed});
}catch(e){setError('Errore lettura file: '+file.name);}
}
setFiles(prev=>[...prev,...newFiles]);

/* ── ODONTOGRAMMA ── */
// FDI: Q1=18..11 (sup dx, a sinistra), Q2=21..28 (sup sx, a destra)
//      Q4=48..41 (inf dx, a sinistra), Q3=31..38 (inf sx, a destra)
// Visualizzato come se il paziente fosse di fronte a noi:
// | 18 17 16 15 14 13 12 11 | 21 22 23 24 25 26 27 28 |
// | 48 47 46 45 44 43 42 41 | 31 32 33 34 35 36 37 38 |

const ODO_ROWS=[
[18,17,16,15,14,13,12,11,  21,22,23,24,25,26,27,28],
[48,47,46,45,44,43,42,41,  31,32,33,34,35,36,37,38],
];
// Dimensione dente per numero: molari/giudizio più larghi
const denteW=n=>{const u=n%10;return(u===8||u===7||u===6)?20:16;};
const denteH=n=>{const u=n%10;return(u===8||u===7||u===6)?26:22;};

const Odontogramma=({selected,onChange,nvDente,onDenteChange})=>{
const toggle=d=>{
const s=new Set(selected);
s.has(d)?s.delete(d):s.add(d);
const arr=[...s];
onChange(arr);
// aggiorna il campo dente testo live
onDenteChange(arr.length>0?arr.sort((a,b)=>a-b).join(', '):'');
};
const clearAll=()=>{onChange([]);onDenteChange('');};

const renderRow=(row,rowIdx)=>{
// splittiamo a metà: prima metà = Q1 o Q4 (dx), seconda metà = Q2 o Q3 (sx)
const sup=rowIdx===0;
return <div style={{display:'flex',justifyContent:'center',alignItems:sup?'flex-end':'flex-start',gap:1}}>
{row.map((d,i)=>{
const sel=selected.includes(d);
const isCenter=i===7||i===8; // confine tra quadranti
const w=denteW(d),h=denteH(d);
const br=sup
?`${i<8?3:3}px ${i<8?3:3}px 1px 1px`
:`1px 1px ${i<8?3:3}px ${i<8?3:3}px`;
return <React.Fragment key={d}>
{i===8&&<div style={{width:2,background:C.pri+'30',alignSelf:'stretch',borderRadius:1,margin:'0 1px'}}/>}
<button onClick={()=>toggle(d)} title={`Dente ${d}`} style={{
width:w,height:h,
borderRadius:br,
background:sel?C.pri:C.sur,
border:`1.5px solid ${sel?C.pri:C.brd}`,
cursor:'pointer',padding:0,flexShrink:0,
display:'flex',flexDirection:'column',
alignItems:'center',
justifyContent:sup?'flex-end':'flex-start',
paddingTop:sup?0:2,paddingBottom:sup?2:0,
transition:'background 0.1s,border 0.1s',
boxShadow:sel?`0 0 0 1px ${C.pri}40`:'none',
}}>
<span style={{fontSize:6.5,fontWeight:700,color:sel?'#fff':C.txl,lineHeight:1,userSelect:'none'}}>{d}</span>
</button>
</React.Fragment>;
})}
</div>;
};

return <div style={{background:C.bg,borderRadius:10,padding:'10px 8px 8px',marginBottom:10}}>
<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:7}}>
<div style={{fontSize:11,fontWeight:800,color:C.pri,textTransform:'uppercase',letterSpacing:'0.06em'}}>🦷 Seleziona denti</div>
{selected.length>0&&<button onClick={clearAll} style={{background:C.danL,border:'none',borderRadius:5,padding:'2px 8px',fontSize:10,color:C.dan,fontWeight:700,cursor:'pointer'}}>✕ deseleziona</button>}
</div>
{/* etichette quadranti */}
<div style={{display:'flex',justifyContent:'center',gap:1,marginBottom:3}}>
<div style={{flex:1,textAlign:'center',fontSize:8,color:C.txl,fontWeight:700}}>Q1 (dx)</div>
<div style={{width:4}}/>
<div style={{flex:1,textAlign:'center',fontSize:8,color:C.txl,fontWeight:700}}>Q2 (sx)</div>
</div>
{/* riga superiore */}
{renderRow(ODO_ROWS[0],0)}
{/* separatore gengiva */}
<div style={{height:6,display:'flex',alignItems:'center',justifyContent:'center',margin:'2px 0'}}>
<div style={{flex:1,height:2,background:`linear-gradient(to left,${C.brd} 40%,${C.pri}50 100%)`,borderRadius:1}}/>
<div style={{width:10,height:2,background:C.pri,borderRadius:1,margin:'0 1px'}}/>
<div style={{flex:1,height:2,background:`linear-gradient(to right,${C.brd} 40%,${C.pri}50 100%)`,borderRadius:1}}/>
</div>
{/* riga inferiore */}
{renderRow(ODO_ROWS[1],1)}
<div style={{display:'flex',justifyContent:'center',gap:1,marginTop:3}}>
<div style={{flex:1,textAlign:'center',fontSize:8,color:C.txl,fontWeight:700}}>Q4 (dx)</div>
<div style={{width:4}}/>
<div style={{flex:1,textAlign:'center',fontSize:8,color:C.txl,fontWeight:700}}>Q3 (sx)</div>
</div>
{selected.length>0&&<div style={{textAlign:'center',marginTop:5,fontSize:11,color:C.pri,fontWeight:700}}>
Selezionati: {selected.slice().sort((a,b)=>a-b).join(', ')}
</div>}
<div style={{fontSize:9,color:C.txl,textAlign:'center',marginTop:4}}>Tocca uno o più denti · selezione multipla</div>
</div>;
};

useEffect(()=>{
if(initPatId){
setForm({pazienteId:String(initPatId),titolo:'',data:today(),voci:[],stato:'attivo',sconto:0,scontoTipo:'pct'});

const kpi={
totali:plans.length,

accettati:plans.filter(p=>p.stato==='accettato').length,

};

// calcolo sconto e totale finale per un piano
const calcTot=(voci,sconto,scontoTipo)=>{
const sub=voci.reduce((s,v)=>s+Number(v.prezzo),0);
const sc=Number(sconto)||0;
const scontato=scontoTipo==='pct'?sub*(sc/100):Math.min(sc,sub);
return {sub,scontato,finale:Math.max(0,sub-scontato)};
};

const addVoce=()=>{
if(!nv.prestazione)return;
const prezzoUnit=Number(nv.prezzo)||0;
const denti=selectedDenti.length>0?selectedDenti.slice().sort((a,b)=>a-b):[];
if(denti.length>1){
// una riga per ogni dente
const nuove=denti.map(d=>({prestazione:nv.prestazione,dente:String(d),prezzo:prezzoUnit,eseguita:false,incassata:false}));
setForm(f=>({...f,voci:[...f.voci,...nuove]}));
}else{
const denteStr=denti.length===1?String(denti[0]):(nv.dente||'');
setForm(f=>({...f,voci:[...f.voci,{prestazione:nv.prestazione,dente:denteStr,prezzo:prezzoUnit,eseguita:false,incassata:false}]}));

setSelectedDenti([]);

setModal(false);setToast('Piano salvato ✓');
};
const toggleEseguita=(plId,i)=>setPlans(p=>p.map(pl=>pl.id===plId?{...pl,voci:pl.voci.map((v,j)=>j===i?{...v,eseguita:!v.eseguita,dataEsec:!v.eseguita?today():null,incassata:!v.eseguita?v.incassata:false}:v)}:pl));
const toggleIncassata=(plId,i)=>setPlans(p=>p.map(pl=>pl.id===plId?{...pl,voci:pl.voci.map((v,j)=>j===i?{...v,incassata:!v.incassata}:v)}:pl));
const setStato=(plId,stato)=>setPlans(p=>p.map(pl=>pl.id===plId?{...pl,stato}:pl));
const del=id=>{if(confirm('Eliminare piano?'))setPlans(p=>p.filter(pl=>pl.id!==id));};
const selPr=nome=>{const item=pricelist.find(p=>p.nome===nome);setNv(v=>({...v,prestazione:nome,prezzo:item?item.prezzo:v.prezzo}));};

const openWA=(pl,mode)=>{
const p=patients.find(x=>x.id===pl.pazienteId);
const {sub,scontato,finale}=calcTot(pl.voci,pl.sconto||0,pl.scontoTipo||'pct');
const vociTxt=pl.voci.map((v,i)=>`${i+1}. ${v.prestazione}${v.dente?` (d.${v.dente})`:''} — ${fmt(v.prezzo)}`).join('\n');
const scontoTxt=scontato>0?`\n🏷️ Sconto: −${fmt(scontato)}`:'';
const msg=mode==='piano'
?`Gentile ${p?.nome||''} ${p?.cognome||''},\npiano di cura *${pl.titolo}*:\n\n${vociTxt}${scontoTxt}\n\n💰 *Totale: ${fmt(finale)}*\n\nGrazie, Studio Dentistico.`
:`Gentile ${p?.nome||''} ${p?.cognome||''},\nil suo preventivo *${pl.titolo}* è pronto.${scontoTxt}\n\n💰 *Totale: ${fmt(finale)}*\n\nContattarci per confermare.\nGrazie, Studio Dentistico.`;
setWaMsg(msg);setWaModal({pl,paz:p});
};
const sendWA=()=>{
if(!waModal?.paz?.telefono||!waMsg)return;
window.open(`https://wa.me/39${waModal.paz.telefono.replace(/\D/g,'')}?text=${encodeURIComponent(waMsg)}`,'_blank');

const fillTpl=(tplId,pl,paz)=>{
const t=templates.find(x=>x.id===Number(tplId));if(!t)return;

setWaMsg(t.testo.replace(/{nome}/g,`${paz?.nome||''} ${paz?.cognome||''}`).replace(/{totale}/g,fmt(finale)).replace(/{voci}/g,voci).replace(/{data}/g,'').replace(/{ora}/g,'').replace(/{tipo}/g,''));

const Pagamenti=({patients,payments,setPayments,plans})=>{
const [modal,setModal]=useState(false);
const [form,setForm]=useState({pazienteId:'',data:today(),importo:'',metodo:'Contanti',nota:'',stato:'pagato'});
const [toast,setToast]=useState('');
const F=f=>setForm(p=>({...p,...f}));

// calcola saldo per un paziente
const saldoPaz=(pazId)=>{
const patPlans=plans.filter(pl=>pl.pazienteId===Number(pazId));
const dovuto=patPlans.reduce((s,pl)=>{
const sub=pl.voci.reduce((a,v)=>a+Number(v.prezzo),0);
const sc=Number(pl.sconto)||0;
const scontato=pl.scontoTipo==='pct'?sub*(sc/100):Math.min(sc,sub);
return s+Math.max(0,sub-scontato);
},0);
const pagato=payments.filter(p=>p.pazienteId===Number(pazId)).reduce((s,p)=>s+Number(p.importo),0);
return {dovuto,pagato,residuo:Math.max(0,dovuto-pagato)};
};

const save=()=>{
if(!form.pazienteId||!form.importo)return;
setPayments(p=>[...p,{...form,id:uid(),pazienteId:Number(form.pazienteId),importo:Number(form.importo)}]);
setModal(false);setToast('Registrato ✓');
};
const del=id=>{if(confirm('Eliminare?'))setPayments(p=>p.filter(x=>x.id!==id));};
const total=payments.reduce((s,p)=>s+Number(p.importo),0);
const mese=payments.filter(p=>p.data&&p.data.startsWith(today().slice(0,7))).reduce((s,p)=>s+Number(p.importo),0);

const selPazSaldo=form.pazienteId?saldoPaz(form.pazienteId):null;

return <div>
{toast&&<Toast msg={toast} onDone={()=>setToast('')}/>}
<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
<div style={{fontSize:20,fontWeight:800}}>Pagamenti</div>
<Btn ch="Nuovo" ic="plus" onClick={()=>{setForm({pazienteId:'',data:today(),importo:'',metodo:'Contanti',nota:'',stato:'pagato'});setModal(true);}}/>
</div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
<Crd style={{display:'flex',alignItems:'center',gap:11,padding:12}}><div style={{background:C.sucL,borderRadius:10,padding:9}}><Ic n="eur" s={20} c={C.suc}/></div><div><div style={{fontSize:17,fontWeight:800}}>{fmt(total)}</div><div style={{fontSize:11,color:C.txm,fontWeight:600}}>Totale incassato</div></div></Crd>
<Crd style={{display:'flex',alignItems:'center',gap:11,padding:12}}><div style={{background:C.priL,borderRadius:10,padding:9}}><Ic n="clk" s={20} c={C.pri}/></div><div><div style={{fontSize:17,fontWeight:800}}>{fmt(mese)}</div><div style={{fontSize:11,color:C.txm,fontWeight:600}}>Questo mese</div></div></Crd>
</div>
<div style={{display:'flex',flexDirection:'column',gap:9}}>
{[...payments].reverse().map(pay=>{
const p=patients.find(x=>x.id===pay.pazienteId);
const {residuo}=saldoPaz(pay.pazienteId);
return <Crd key={pay.id}>
<div style={{display:'flex',alignItems:'center',gap:10}}>
<div style={{background:C.sucL,borderRadius:9,padding:8,flexShrink:0}}><Ic n="eur" s={16} c={C.suc}/></div>
<div style={{flex:1,minWidth:0}}>
<div style={{fontWeight:700,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p?`${p.nome} ${p.cognome}`:'—'}</div>
<div style={{fontSize:11,color:C.txm}}>{fmtD(pay.data)}{pay.nota?' · '+pay.nota:''}</div>
<div style={{marginTop:3,display:'flex',gap:4,flexWrap:'wrap'}}>
<Bdg ch={pay.metodo} co={C.pri}/>
<Bdg ch={pay.stato} co={pay.stato==='pagato'?C.suc:C.war}/>
{residuo>0?<Bdg ch={`residuo ${fmt(residuo)}`} co={C.dan}/>:<Bdg ch="saldato ✓" co={C.suc}/>}
</div>
</div>
<div style={{textAlign:'right',flexShrink:0}}>
<div style={{fontWeight:800,color:C.suc,fontSize:15}}>{fmt(pay.importo)}</div>
<button onClick={()=>del(pay.id)} style={{background:'none',border:'none',cursor:'pointer',marginTop:3,padding:2}}><Ic n="del" s={13} c={C.dan}/></button>
</div>
</div>
</Crd>;
})}
{payments.length===0&&<div style={{textAlign:'center',color:C.txl,padding:40}}>Nessun pagamento</div>}
</div>
{modal&&<Modal title="Registra pagamento" onClose={()=>setModal(false)}>
<Fld label="Paziente">
<Sel value={form.pazienteId} onChange={e=>F({pazienteId:e.target.value})}>
<option value="">Seleziona…</option>
{patients.map(p=><option key={p.id} value={p.id}>{p.nome} {p.cognome}</option>)}
</Sel>
</Fld>
{selPazSaldo&&<div style={{background:C.priD,borderRadius:10,padding:11,marginBottom:11}}>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
<div><div style={{fontSize:9,color:'rgba(255,255,255,0.5)',textTransform:'uppercase'}}>Dovuto</div><div style={{fontSize:14,fontWeight:800,color:'#fff'}}>{fmt(selPazSaldo.dovuto)}</div></div>
<div style={{textAlign:'center'}}><div style={{fontSize:9,color:'rgba(255,255,255,0.5)',textTransform:'uppercase'}}>Già pagato</div><div style={{fontSize:14,fontWeight:800,color:'#86efac'}}>{fmt(selPazSaldo.pagato)}</div></div>
<div style={{textAlign:'right'}}><div style={{fontSize:9,color:'rgba(255,255,255,0.5)',textTransform:'uppercase'}}>Residuo</div><div style={{fontSize:14,fontWeight:800,color:selPazSaldo.residuo>0?'#FCA5A5':'#86efac'}}>{fmt(selPazSaldo.residuo)}</div></div>
</div>
{selPazSaldo.residuo>0&&<button onClick={()=>F({importo:selPazSaldo.residuo.toFixed(2)})} style={{width:'100%',padding:'7px',background:'rgba(255,255,255,0.1)',border:'1px solid rgba(255,255,255,0.2)',borderRadius:7,color:'#fff',fontWeight:700,fontSize:11,cursor:'pointer'}}>
↑ Usa importo residuo ({fmt(selPazSaldo.residuo)})
</button>}
</div>}
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
<Fld label="Data"><Inp type="date" value={form.data} onChange={e=>F({data:e.target.value})}/></Fld>
<Fld label="Importo €"><Inp type="number" inputMode="decimal" value={form.importo} onChange={e=>F({importo:e.target.value})}/></Fld>
<Fld label="Metodo"><Sel value={form.metodo} onChange={e=>F({metodo:e.target.value})}>{['Contanti','Carta','Bonifico','POS','Assegno'].map(m=><option key={m}>{m}</option>)}</Sel></Fld>
<Fld label="Stato"><Sel value={form.stato} onChange={e=>F({stato:e.target.value})}><option value="pagato">Pagato</option><option value="acconto">Acconto</option><option value="sospeso">Sospeso</option></Sel></Fld>
</div>
<Fld label="Nota"><Inp value={form.nota} onChange={e=>F({nota:e.target.value})}/></Fld>
<div style={{display:'flex',gap:8,marginTop:8}}><Btn ch="Annulla" v="sec" onClick={()=>setModal(false)} full/><Btn ch="Salva" onClick={save} full/></div>
</Modal>}
</div>;
};

const tp=templates.find(x=>x.id===Number(id));if(!tp)return;
setCustomMsg(tp.testo.replace(/{nome}/g,paz?`${paz.nome} ${paz.cognome}`:'').replace(/{data}/g,app?fmtD(app.data):'').replace(/{ora}/g,app?app.ora:'').replace(/{tipo}/g,app?app.tipo:'').replace(/{totale}/g,'').replace(/{voci}/g,''));
setSelTpl(id);
};
const sendRemind=a=>{
const p=patients.find(x=>x.id===a.pazienteId);if(!p?.telefono)return;
const tp=templates.find(x=>x.id===1)||{testo:'Gentile {nome},\nappuntamento il {data} alle {ora} ({tipo}).\nGrazie!'};
const msg=tp.testo.replace(/{nome}/g,`${p.nome} ${p.cognome}`).replace(/{data}/g,fmtD(a.data)).replace(/{ora}/g,a.ora).replace(/{tipo}/g,a.tipo).replace(/{totale}/g,'').replace(/{voci}/g,'');
window.open(`https://wa.me/39${p.telefono.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank');
};
const sendCustom=()=>{
const p=patients.find(x=>x.id===Number(selPaz));if(!p?.telefono||!customMsg)return;
window.open(`https://wa.me/39${p.telefono.replace(/\D/g,'')}?text=${encodeURIComponent(customMsg)}`,'_blank');

</Crd>)}
</div>}

<div style={{fontSize:19,fontStyle:'italic',fontWeight:700}}>{si.nome||'Nome Studio'}</div>
{si.spec&&<div style={{fontSize:11,color:'#4A90C4',marginTop:2}}>{si.spec}</div>}

<Fld label="Telefono"><Inp type="tel" value={si.tel} onChange={e=>S({tel:e.target.value})}/></Fld>
<Fld label="Email"><Inp type="email" value={si.email} onChange={e=>S({email:e.target.value})}/></Fld>
<Fld label="Sede 1"><Inp value={si.addr1} onChange={e=>S({addr1:e.target.value})}/></Fld>

<Crd style={{marginBottom:11}}>
<div style={{fontSize:11,fontWeight:700,color:C.pri,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Note legali PDF</div>

{/* ── SEZIONE AGENDA: TIPI E COLORI ── */}
<div style={{marginTop:26,marginBottom:14}}>

<Crd style={{marginBottom:14,padding:0,overflow:'hidden'}}>
{appTypes.map((t,i)=>(

))}
{appTypes.length===0&&<div style={{textAlign:'center',color:C.txl,padding:24}}>Nessun tipo configurato</div>}

{/* MODAL NUOVO/MODIFICA TIPO */}

<Fld label="Nome"><Inp value={tipoForm.nome} onChange={e=>setTipoForm(f=>({...f,nome:e.target.value}))} placeholder="es. Igiene, Urgenza, Controllo…"/></Fld>
<Fld label="Colore">

))}

</Fld>
{/* anteprima */}
<div style={{background:C.bg,borderRadius:9,padding:10,marginTop:6,marginBottom:11,display:'flex',alignItems:'center',gap:9}}>

<div style={{display:'flex',gap:7}}>
{tipoModal!=='new'&&<Btn ch="Elimina" v="dan" sz="sm" onClick={()=>delTipo(tipoModal)}/>}

/* ── NAV ── */
const NAV=[
{id:'home',l:'Home',ic:'home'},
{id:'paz',l:'Pazienti',ic:'pz'},
{id:'piani',l:'Piani',ic:'plan'},
{id:'paga',l:'Pagamenti',ic:'pay'},
{id:'listino',l:'Listino',ic:'list'},
{id:'agenda',l:'Agenda',ic:'cal'},
{id:'wa',l:'WhatsApp',ic:'wa'},
{id:'set',l:'Setup',ic:'set'},
];

/* ── APP ── */
function App(){
const [session,setSession]=useState(undefined); // undefined=non controllato, null=non loggato, obj=loggato
const [dataLoading,setDataLoading]=useState(true);
const [page,setPage]=useState('home');
const [patients,setPatients]=useState([]);
const [appointments,setAppointments]=useState([]);
const [plans,setPlans]=useState([]);
const [payments,setPayments]=useState([]);
const [pricelist,setPricelist]=useState([]);
const [templates,setTemplates]=useState([]);
const [studioInfo,setStudioInfo]=useState(DEF_STUDIO);
const [appTypes,setAppTypes]=useState([]);
const [initPatId,setInitPatId]=useState(null);
const [schedaDashPaz,setSchedaDashPaz]=useState(null);

// ── controllo sessione all'avvio + listener cambi auth ──
useEffect(()=>{
supabase.auth.getSession().then(({data})=>setSession(data.session));
const {data:listener}=supabase.auth.onAuthStateChange((_event,sess)=>{
setSession(sess);
});
return()=>listener.subscription.unsubscribe();
},[]);

// ── carica tutti i dati cloud quando l'utente è loggato ──
useEffect(()=>{
if(!session)return;
let cancelled=false;
(async()=>{
setDataLoading(true);
try{
const [p,a,pl,py,pr,tp,at,si]=await Promise.all([
DB.getAll('dm_p'),
DB.getAll('dm_a'),
DB.getAll('dm_pl'),
DB.getAll('dm_py'),
DB.getAll('dm_pr'),
DB.getAll('dm_tp'),
DB.getAll('dm_at'),
DB.getStudioInfo(),
]);
if(cancelled)return;
setPatients(p||[]);
setAppointments(a||[]);
setPlans(pl||[]);
setPayments(py||[]);
if(!pr||pr.length===0){
const seeded=await Promise.all(DEF_PRICE.map(item=>{const {id,...rest}=item;return DB.insert('dm_pr',rest);}));
setPricelist(seeded);
}else setPricelist(pr);
if(!tp||tp.length===0){
const seeded=await Promise.all(DEF_TPL.map(item=>{const {id,...rest}=item;return DB.insert('dm_tp',rest);}));
setTemplates(seeded);
}else setTemplates(tp);
if(!at||at.length===0){
const seeded=await Promise.all(DEF_APP_TYPES.map(item=>{const {id,...rest}=item;return DB.insert('dm_at',rest);}));
setAppTypes(seeded);
}else setAppTypes(at);
setStudioInfo(si||DEF_STUDIO);
}catch(err){
console.error('Errore caricamento dati cloud:',err);
}
if(!cancelled)setDataLoading(false);
})();
return()=>{cancelled=true;};
},[session]);

// ── wrapper setter "intelligente": confronta prev/next e traduce le differenze
// in insert/update/delete reali su Supabase, sostituendo gli id temporanei locali
// con gli id veri assegnati dal database.
const makeSyncSetter=(key,setLocal)=>{
return (updater)=>{
setLocal(prev=>{
const next=typeof updater==='function'?updater(prev):updater;
const prevIds=new Set(prev.map(x=>x.id));
const nextIds=new Set(next.map(x=>x.id));

prev.forEach(item=>{
if(!nextIds.has(item.id))DB.remove(key,item.id).catch(e=>console.error('remove',key,e));
});

const nuovi=next.filter(item=>!prevIds.has(item.id));
if(nuovi.length>0){
(async()=>{
for(const item of nuovi){
try{
const {id:tempId,...rest}=item;
const saved=await DB.insert(key,rest);
setLocal(curr=>curr.map(x=>x.id===tempId?{...x,id:saved.id}:x));
}catch(e){console.error('insert',key,e);}
}
})();
}

next.forEach(item=>{
if(prevIds.has(item.id)){
const before=prev.find(x=>x.id===item.id);
if(before&&JSON.stringify(before)!==JSON.stringify(item)){
const {id,...rest}=item;
DB.update(key,id,rest).catch(e=>console.error('update',key,e));
}
}
});

return next;
});
};
};

const setPatientsSync=makeSyncSetter('dm_p',setPatients);
const setAppointmentsSync=makeSyncSetter('dm_a',setAppointments);
const setPlansSync=makeSyncSetter('dm_pl',setPlans);
const setPaymentsSync=makeSyncSetter('dm_py',setPayments);
const setPricelistSync=makeSyncSetter('dm_pr',setPricelist);
const setTemplatesSync=makeSyncSetter('dm_tp',setTemplates);
const setAppTypesSync=makeSyncSetter('dm_at',setAppTypes);

const setStudioInfoSync=(updaterOrVal)=>{
setStudioInfo(prev=>{
const next=typeof updaterOrVal==='function'?updaterOrVal(prev):updaterOrVal;
DB.setStudioInfo(next).catch(e=>console.error('Errore salvataggio studio info',e));
return next;
});
};

const goNuovoPiano=id=>{setInitPatId(id);setPage('piani');};
const goSchedaPaz=(paz,tab='paga')=>setSchedaDashPaz({paz,tab});

const handleLogout=async()=>{
await supabase.auth.signOut();
setPatients([]);setAppointments([]);setPlans([]);setPayments([]);
setPricelist([]);setTemplates([]);setAppTypes([]);setStudioInfo(DEF_STUDIO);
setPage('home');
};

if(session===undefined)return <LoadingScreen/>;
if(session===null)return <LoginScreen onLogin={()=>{}}/>;
if(dataLoading)return <LoadingScreen/>;

return <div style={{display:'flex',flexDirection:'column',height:'100dvh',background:C.bg,overflow:'hidden'}}>
<div style={{background:C.priD,padding:'11px 14px',paddingTop:'max(11px,env(safe-area-inset-top))',display:'flex',alignItems:'center',gap:9,flexShrink:0}}>
<div style={{background:C.acc,borderRadius:7,padding:5}}><Ic n="tooth" s={16} c="#fff"/></div>
<span style={{color:'#fff',fontWeight:800,fontSize:15}}>DentalManager</span>
<div style={{marginLeft:'auto',fontSize:11,color:'rgba(255,255,255,0.55)',fontWeight:600,display:'flex',alignItems:'center',gap:10}}>
<span>{NAV.find(n=>n.id===page)?.l}</span>
<button onClick={handleLogout} title="Esci" style={{background:'rgba(255,255,255,0.12)',border:'none',borderRadius:6,padding:'4px 8px',color:'#fff',fontSize:10,fontWeight:700,cursor:'pointer'}}>Esci</button>
</div>
</div>
{schedaDashPaz&&<SchedaPaz
paz={schedaDashPaz.paz}
initTab={schedaDashPaz.tab}
plans={plans} setPlans={setPlansSync}
payments={payments}
appointments={appointments}
si={studioInfo}
onClose={()=>setSchedaDashPaz(null)}
onEdit={()=>setSchedaDashPaz(null)}
onNuovoPiano={id=>{setSchedaDashPaz(null);goNuovoPiano(id);}}
/>}
<div style={{flex:1,overflowY:'auto',padding:13,paddingBottom:78}}>
{page==='home'&&<Dashboard patients={patients} appointments={appointments} payments={payments} plans={plans} onOpenPaz={goSchedaPaz}/>}
{page==='paz'&&<Pazienti patients={patients} setPatients={setPatientsSync} plans={plans} setPlans={setPlansSync} payments={payments} appointments={appointments} si={studioInfo} onNuovoPiano={goNuovoPiano}/>}
{page==='piani'&&<Piani patients={patients} plans={plans} setPlans={setPlansSync} pricelist={pricelist} templates={templates} si={studioInfo} initPatId={initPatId} onClearInitPat={()=>setInitPatId(null)}/>}
{page==='paga'&&<Pagamenti patients={patients} payments={payments} setPayments={setPaymentsSync} plans={plans}/>}
{page==='listino'&&<Listino pricelist={pricelist} setPricelist={setPricelistSync}/>}
{page==='agenda'&&<Agenda patients={patients} appointments={appointments} setAppointments={setAppointmentsSync} appTypes={appTypes}/>}
{page==='wa'&&<WhatsApp patients={patients} appointments={appointments} templates={templates} setTemplates={setTemplatesSync}/>}
{page==='set'&&<Impostazioni studioInfo={studioInfo} setStudioInfo={setStudioInfoSync} appTypes={appTypes} setAppTypes={setAppTypesSync}/>}
</div>
<div style={{position:'fixed',bottom:0,left:0,right:0,background:C.sur,borderTop:`1px solid ${C.brd}`,display:'grid',gridTemplateColumns:`repeat(${NAV.length},1fr)`,paddingBottom:'env(safe-area-inset-bottom,0px)',zIndex:100,boxShadow:'0 -2px 10px rgba(0,0,0,0.07)'}}>
{NAV.map(n=><button key={n.id} onClick={()=>setPage(n.id)} style={{background:'none',border:'none',cursor:'pointer',padding:'7px 1px',display:'flex',flexDirection:'column',alignItems:'center',gap:2,color:page===n.id?C.pri:C.txl}}>
<div style={{background:page===n.id?C.priL:'transparent',borderRadius:7,padding:'3px 5px'}}><Ic n={n.ic} s={17} c={page===n.id?C.pri:C.txl}/></div>
<span style={{fontSize:8,fontWeight:page===n.id?800:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'100%'}}>{n.l}</span>
</button>)}
</div>
</div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
