<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>

<meta name="apple-mobile-web-app-capable" content="yes"/>

<title>Poliedra</title>
<style>
  html, body { background: #F0F4F8; margin: 0; }
  #root:empty { min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
  #root:empty::after {
    content: '';
    width: 38px; height: 38px;
    border: 3px solid #E2E8F0; border-top-color: #185FA5;
    border-radius: 50%;
    animation: dm-splash-spin 0.8s linear infinite;
  }
  @keyframes dm-splash-spin { to { transform: rotate(360deg); } }
</style>

<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
